# Every rule and assumption below was fixed before results were examined.
raw_dir: data/raw
out_dir: reports
publication_date: "2026-10-24"

# Universe: every listed company whose Yahoo business summary describes it as a business development company,
# minus notes, preferreds and ETNs; a company enters when it has quarterly NAV and prices.
exclude: [BDCZ, GAINI, MFICL, OFSSO, OXSQH, RWAYI, PSEC-PA, PFLA, FSCO, SSSS, RAND, EQS, FRBP, HTFB, CICB, PIAC, BCIC]
nav_lag_days: 50          # a quarter's NAV is treated as public 50 days after quarter-end (10-Q deadline is 40-45 days)
horizon_quarters: 4       # outcome: change in NAV per share over the next four quarters
pnav_bounds: [0.3, 2.0]   # discard implausible price/NAV readings (data errors)
buckets: [0.85, 1.00]     # deep discount < 0.85 <= modest discount < 1.00 <= premium
nav_usd: 1000000000       # illustrative private-credit book for the valuation-governance example

sources:
  prices.parquet:
    url: https://huggingface.co/datasets/defeatbeta/yahoo-finance-data/resolve/main/data/US/stock_prices.parquet
    sha256: 903dbb965979f8b92a60b01524372f42be0e4bf88c291caf87171a286149be32
  stock_dividend_events.parquet:
