# Downloaded 2026-10-20 (prices, dividends, splits, yields) and 2026-10-24 (statements, profiles); ingest.py stops if a file changes.
# Added after the first run, disclosed in the README: the first run surfaced share-count breaks (reverse splits, pre-listing
# prices) that produced NAV-per-share jumps of 50-100%; the screen and the lag robustness check were added then.
robust_lags: [75, 90]     # robustness: treat NAVs as public 75 and 90 days after quarter-end
max_qoq_nav_jump: 0.25    # a quarter-on-quarter NAV/share move above 25% is treated as a data break
